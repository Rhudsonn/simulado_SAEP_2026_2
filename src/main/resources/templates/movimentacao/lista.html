<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Movimentações')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Movimentações</h2>
        <a th:href="@{/movimentacoes/nova}" class="btn btn-success">Nova Movimentação</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Produto</th>
                <th>Tipo</th>
                <th>Quantidade</th>
                <th>Data/Hora</th>
                <th>Responsável</th>
                <th>Observação</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${movimentacoes}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.produto.nome}"></td>
                <td>
                    <span th:text="${m.tipo.descricao}"
                          th:class="${m.tipo.name() == 'ENTRADA'} ? 'badge bg-success' : 'badge bg-danger'"></span>
                </td>
                <td th:text="${m.quantidade}"></td>
                <td th:text="${#temporals.format(m.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                <td th:text="${m.usuarioResponsavel.nome}"></td>
                <td th:text="${m.observacao}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(movimentacoes.content)}">
                <td colspan="7" class="text-center text-muted">Nenhuma movimentação registrada.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/movimentacoes(page=${currentPage - 1})}">Anterior</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/movimentacoes(page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/movimentacoes(page=${currentPage + 1})}">Próxima</a>
            </li>
        </ul>
    </nav>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
