<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Produtos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Produtos</h2>
        <a th:href="@{/produtos/novo}" class="btn btn-primary">Novo Produto</a>
    </div>

    <form th:action="@{/produtos}" method="get" class="row g-3 mb-4">
        <div class="col-md-4">
            <label class="form-label">Nome</label>
            <input type="text" name="nome" class="form-control" th:value="${nome}" placeholder="Filtrar por nome">
        </div>
        <div class="col-md-3">
            <label class="form-label">Data início</label>
            <input type="date" name="dataInicio" class="form-control" th:value="${dataInicio}">
        </div>
        <div class="col-md-3">
            <label class="form-label">Data fim</label>
            <input type="date" name="dataFim" class="form-control" th:value="${dataFim}">
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-secondary w-100">Filtrar</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Estoque</th>
                <th>Data Cadastro</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${produtos}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nome}"></td>
                <td th:text="${p.descricao}"></td>
                <td>
                    <span th:text="${p.quantidadeEstoque}"
                          th:class="${p.quantidadeEstoque == 0} ? 'badge bg-danger' : 'badge bg-success'"></span>
                </td>
                <td th:text="${#temporals.format(p.dataCadastro, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <a th:href="@{/produtos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/produtos/excluir/{id}(id=${p.id})}"
                       class="btn btn-sm btn-danger"
                       sec:authorize="hasRole('ADMIN')"
                       onclick="return confirm('Confirma exclusão?')">Excluir</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(produtos.content)}">
                <td colspan="6" class="text-center text-muted">Nenhum produto encontrado.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/produtos(page=${currentPage - 1}, nome=${nome}, dataInicio=${dataInicio}, dataFim=${dataFim})}">Anterior</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/produtos(page=${i}, nome=${nome}, dataInicio=${dataInicio}, dataFim=${dataFim})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/produtos(page=${currentPage + 1}, nome=${nome}, dataInicio=${dataInicio}, dataFim=${dataFim})}">Próxima</a>
            </li>
        </ul>
    </nav>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
