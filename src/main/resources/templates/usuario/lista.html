<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Usuários</h2>
        <a th:href="@{/usuarios/novo}" class="btn btn-primary">Novo Usuário</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Username</th>
                <th>Perfil</th>
                <th>Ativo</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.nome}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.perfil.descricao}"></td>
                <td>
                    <span th:text="${u.ativo} ? 'Sim' : 'Não'"
                          th:class="${u.ativo} ? 'badge bg-success' : 'badge bg-secondary'"></span>
                </td>
                <td>
                    <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/usuarios/excluir/{id}(id=${u.id})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('Confirma exclusão?')">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
