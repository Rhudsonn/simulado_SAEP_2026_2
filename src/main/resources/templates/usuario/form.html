<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container">
    <h2 th:text="${titulo}">Usuário</h2>
    <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post" class="mt-3">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Nome *</label>
            <input type="text" class="form-control" th:field="*{nome}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Username *</label>
            <input type="text" class="form-control" th:field="*{username}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Senha <span th:if="${usuario.id != null}">(deixe em branco para manter)</span></label>
            <input type="password" class="form-control" th:field="*{senha}" th:required="${usuario.id == null}">
        </div>
        <div class="mb-3">
            <label class="form-label">Perfil *</label>
            <select class="form-select" th:field="*{perfil}" required>
                <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.descricao}"></option>
            </select>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" th:field="*{ativo}" id="ativo">
            <label class="form-check-label" for="ativo">Ativo</label>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
